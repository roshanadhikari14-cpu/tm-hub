<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="magic.css">
<link rel="stylesheet" href="bits.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="premium.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5'/%3E%3Crect fill='%23008cff' x='2.94' y='12.02' width='7.73' height='7.96'/%3E%3Cpolygon fill='%2300bfba' points='20.71 16 17.85 19.98 12.58 19.98 12.58 12.02 17.85 12.02 20.71 16'/%3E%3Cpolygon fill='%2300e500' points='29.86 16 27.09 19.98 20.12 19.98 22.9 16 20.12 12.02 27.09 12.02 29.86 16'/%3E%3C/svg%3E"><rect width='64' height='64' rx='16' fill='%230d5c63'/><path d='M18 40l10-12 8 7 10-14' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<div id="scrollBar" aria-hidden="true"></div>
<div class="bg-orbs" aria-hidden="true"><span></span><span></span><span></span></div>

<aside class="sidebar">
  <a class="brand" href="#/dashboard" aria-label="Lighthouse V2">
    <span class="brand-mark"><svg class="lh-logo" viewBox="0 0 32 32" aria-hidden="true">
      <defs><clipPath id="lhc"><rect width="32" height="32" rx="5"/></clipPath><linearGradient id="lhs" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
      <rect width="32" height="32" rx="5" fill="#000"/>
      <g clip-path="url(#lhc)">
        <rect class="lh-b1" x="2.94" y="12.02" width="7.73" height="7.96" fill="#008cff"/>
        <polygon class="lh-b2" points="20.71 16 17.85 19.98 12.58 19.98 12.58 12.02 17.85 12.02 20.71 16" fill="#00bfba"/>
        <polygon class="lh-b3" points="29.86 16 27.09 19.98 20.12 19.98 22.9 16 20.12 12.02 27.09 12.02 29.86 16" fill="#00e500"/>
        <rect class="lh-sweep" x="-14" y="0" width="12" height="32" fill="url(#lhs)" transform="skewX(-18)"/>
      </g></svg></span>
    <span class="brand-text"><b>Lighthouse <i class="v2">V2</i></b><small>Roshan's team</small></span>
  </a>
  <nav class="nav">
    <a href="#/dashboard" data-route="dashboard"><i>◎</i><span>Dashboard</span></a>
    <a href="#/team" data-route="team"><i>☺</i><span>Team</span></a>
    <a href="#/tasks" data-route="tasks"><i>☰</i><span>Task board</span></a>
    <a href="#/ptm" data-route="ptm"><i>❖</i><span>PTM</span></a>
    <a href="#/studentreport" data-route="studentreport"><i>▤</i><span>Student report</span></a>
    <a href="#/reports" data-route="reports"><i>✉</i><span>Reports</span></a>
    <a href="#/schedule" data-route="schedule"><i>◷</i><span>Schedule</span></a>
    <a href="#/settings" data-route="settings"><i>⚙</i><span>Settings</span></a>
  </nav>
  <div class="side-status" id="sideStatus"></div>
</aside>

<main class="main">
  <header class="topbar">
    <div class="crumbs"><h1 id="pageTitle">Dashboard</h1><span id="pageSub"></span></div>
    <div class="top-actions">
      <div class="seg" id="slotSeg" role="tablist" aria-label="Report time">
        <span class="seg-ind"></span>
        <button data-slot="morning">11 AM<small>Tasks</small></button>
        <button data-slot="progress">5 PM<small>Progress</small></button>
        <button data-slot="closure">8 PM<small>Closure</small></button>
      </div>
      <button class="btn btn-ghost" id="refreshBtn" title="Fetch the latest from Lighthouse"><span class="spin">⟳</span><span class="lbl">Refresh</span></button>
    </div>
  </header>
  <div id="view" class="view"></div>
</main>

<div class="toasts" id="toasts"></div>
<div class="modal" id="modal" hidden><div class="modal-card" id="modalCard"></div></div>
<script src="bits.js"></script>
<script src="app.js"></script>
<script src="premium.js"></script>
</body>
</html>
